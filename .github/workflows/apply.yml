name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Terraform workspace to apply
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod

concurrency:
  group: ${{ inputs.workspace }}-apply-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write   # for the called plan.yml
  actions: read          # for actions/download-artifact@v8

env:
  PLAN_FILE: tf-plan-${{ inputs.workspace }}-${{ github.sha }}.binary
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  WORKSPACE: ${{ inputs.workspace }}

jobs:
  plan:
    name: Plan
    uses: ./.github/workflows/plan.yml
    with:
      workspace: ${{ inputs.workspace }}
      upload_artifact: true
    secrets: inherit

  apply:
    name: Apply
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.workspace }}

    outputs:
      new_sites: ${{ steps.sites.outputs.new_sites }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Download plan artifact
        id: download_plan
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.PLAN_FILE }}

      - name: Init
        run: terraform init -input=false -backend-config=environments/${{ env.WORKSPACE }}.s3.tfbackend

      - name: Select workspace
        run: terraform workspace select -or-create=true "$WORKSPACE"

      - name: Apply
        run: terraform apply -auto-approve -input=false plan.tfplan

  summary:
    name: Job Summary
    needs: [plan, apply]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Annotate and write job summary
        uses: actions/github-script@v9
        env:
          WORKSPACE: ${{ inputs.workspace }}
          PLAN_RESULT: ${{ needs.plan.result }}
          APPLY_RESULT: ${{ needs.apply.result }}
          NEW_SITES: ${{ needs.apply.outputs.new_sites }}
        with:
          script: |
            const script = require('./.github/scripts/build-apply-summary.js');
            await script({ core, context });