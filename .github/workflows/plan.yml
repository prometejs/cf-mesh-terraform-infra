name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths-ignore: [".github/**"]
  workflow_call:
    inputs:
      workspace:
        description: Terraform workspace to plan against (dev or prod)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      workspace:
        description: Terraform workspace to plan against
        type: choice
        required: true
        default: dev
        options: ["dev", "prod"]

concurrency:
  group: ${{ inputs.workspace }}-plan-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  PLAN_FILE: tf-plan-${{ inputs.workspace || 'dev' }}-${{ github.sha }}.binary
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  WORKSPACE: ${{ inputs.workspace || 'dev' }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  plan:
    name: Plan (${{ inputs.workspace || 'dev' }})
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.workspace || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Terraform Plan
        uses: dflook/terraform-plan@v2
        id: plan
        with:
          path: .
          label: tf-plan-${{ env.WORKSPACE }}
          workspace: ${{ env.WORKSPACE }}
          var_file: fixtures/${{ env.WORKSPACE }}.tfvars
          backend_config_file: environments/${{ env.WORKSPACE }}.s3.tfbackend
          add_github_comment: "${{ github.event_name == 'pull_request' }}"

      - name: Upload plan artifact
        if: github.event_name == 'workflow_call'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLAN_FILE }}
          path: ${{steps.plan.outputs.plan_path }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true